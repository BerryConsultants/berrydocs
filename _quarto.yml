project:
  type: website
  output-dir: docs
  # Puts back the tables Quarto drops from the .llms.md page copies
  # (see scripts/llms-tables.ts)
  post-render: scripts/llms-tables.ts

# llms-txt (below) needs Quarto 1.9 or later
quarto-required: ">=1.9.36"

website:
  site-url: "https://docs.berryconsultants.com"
  llms-txt: true
  favicon: media/FACTS_icon.png
  search:
    location: navbar
    type: overlay
  title: ""
  navbar:
    background: "#FFFFFF"
    logo: "media/FACTSLogo.png"
    pinned: true
    left:
    - href: introduction/index.qmd
      text: "Introduction"
    - href: documentation/index.qmd
      text: "Documentation"
    - href: concepts/index.qmd
      text: "Concepts"

    right:
    - href: blog/index.qmd
      text: "Blog"
    - href: get/index.qmd
      text: "Get FACTS"
    - href: contact/index.qmd
      text: Contact


  sidebar:

  - id: Contact
    title: "Contact"
    style: "floating"
    collapse-level: 1
    contents:
    - contact/index.qmd

  - id: Blog
    title: "Blog"
    style: "floating"
    collapse-level: 1
    contents:
    - blog/index.qmd

  - id: Get FACTS
    title: "Get FACTS"
    style: "floating"
    collapse-level: 1
    contents:
    - get/index.qmd

  - id: Concepts
    title: "Concepts"
    style: "floating"
    collapse-level: 1
    contents:
    - concepts/index.qmd
    - auto: concepts/*.qmd
    - section: concepts/adaptiveDesigns/index.qmd
      contents:
      - auto: concepts/adaptiveDesigns/*.qmd
    - section: concepts/bayes/index.qmd
      contents:
      - auto: concepts/bayes/*.qmd
    - section: FACTS Tips and Tricks
      contents:
      - auto: concepts/facts/*.qmd

  - id: Start
    title: "Introduction"
    style: "floating"
    collapse-level: 1
    contents:
    - introduction/index.qmd
    - section: Getting Started
      contents:
      - introduction/gettingStarted/downloadInstructions.qmd
      - introduction/gettingStarted/installation.qmd
      - introduction/gettingStarted/startingFacts.qmd
      - introduction/gettingStarted/factsMenus.qmd
    # - section: Tutorials
    #   contents:
    #   - section: Phase I Trials
    #     contents:
    #     - auto: introduction/tutorials/phase1/*.qmd
    #   - section: Phase I/II Trials
    #     contents:
    #     - auto: introduction/tutorials/phase12/*.qmd
    #   - section: Phase II Trials
    #     contents:
    #     - auto: introduction/tutorials/phase2/*.qmd
